<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mi Phones – Phone Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="text-align:center; margin:20px 0;">Mi Phones</h1>

<div class="products-container">

    <!-- Redmi note 8 pro -->
    <div class="product-card">
       <img src="images/not8pro.jfif" alt="not8pro">
        <h3>Redmi note 8 pro</h3>
        <p>Approx Price: LKR 65,000</p>
    </div>

    <!-- Redmi note 9 -->
    <div class="product-card">
        <img src="images/note9.jfif" alt="note9">
        <h3>Redmi note 9</h3>
        <p>Approx Price: LKR 72,500</p>
    </div>

    <!-- Redmi note 10 -->
    <div class="product-card">
        <img src="images/note10.jfif" alt="note10">
        <h3>Redmi note 10</h3>
        <p>Approx Price: LKR 80,999</p>
    </div>

    <!-- Redmi note 10 pro -->
    <div class="product-card">
        <img src="images/note10pro.jfif" alt="note10pro">
         <h3>Redmi note pro 10</h3>
        <p>Approx Price: LKR 90,000</p>
    </div>

    <!-- Redmi note 11 -->
    <div class="product-card">
        <img src="images/note11.jfif" alt="note11">
        <h3>Redmi note 11</h3>
        <p>Approx Price: LKR 102,500</p>
    </div>

    <!-- Redmi note 11 pro -->
    <div class="product-card">
        <img src="images/note11pro.jfif" alt="note11pro">
        <h3>Redmi note 11 pro</h3>
        <p>Approx Price: LKR 120,999</p>
    </div>

</div>

<a href="index.html" style="display:block; text-align:center; margin:20px;">⬅ Back to Home</a>

<style>
.products-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    padding: 0 40px;
}

.product-card {
    background: #fff;
    border: 1px solid #ddd;
    text-align: center;
    padding: 15px;
    border-radius: 8px;
}

.product-card img {
    width: 150px;
    height: auto;
}

.product-card h3 {
    margin: 10px 0 5px;
    font-size: 18px;
}

.product-card p {
    color: #555;
    font-size: 15px;
}
</style>

</body>
</html>
