<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Samsung Phones – Phone Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="text-align:center; margin:20px 0;">Samsung Phones</h1>

<div class="products-container">

    <!-- Samsung Galaxy S25 Ultra -->
    <div class="product-card">
          <img src="images/SamsungS25Ultra.jfif" alt="SamsungS25Ultra">
        <h3>Samsung Galaxy S25 Ultra</h3>
        <p>Price: LKR 310,000</p>
    </div>

    <!-- Samsung Galaxy A56 5G -->
    <div class="product-card">
         <img src="images/SamsunA56.jfif" alt="SamsunA56">
        <p>Price: LKR 170,000</p>
    </div>

    <!-- Samsung Galaxy A17 5G -->
    <div class="product-card">
          <img src="images/SamsungA17.jfif" alt="SamsungA17">
        <h3>Samsung Galaxy A17 5G</h3>
        <p>Price: LKR 64,000</p>
    </div>


    <!-- Samsung Galaxy M16 5G -->
    <div class="product-card">
        <img src="images/SamsungM16.jfif" alt="SamsungM16">
        <h3>Samsung Galaxy M16 5G</h3>
        <p>Price: LKR 50,000</p>
    </div>

    <!-- Samsung Galaxy A36 5G -->
    <div class="product-card">
         <img src="images/SamsungA36.jfif" alt="SamsungA36">
        <h3>Samsung Galaxy A36 5G</h3>
        <p>Price: LKR 38,000</p>
    </div>

</div>

<a href="index.html" style="display:block; text-align:center; margin:20px;">⬅ Back to Home</a>

<style>
.products-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    padding: 0 40px;
}

.product-card {
    background: #fff;
    border: 1px solid #ddd;
    text-align: center;
    padding: 15px;
    border-radius: 8px;
}

.product-card img {
    width: 150px;
    height: auto;
}

.product-card h3 {
    margin: 10px 0 5px;
    font-size: 18px;
}

.product-card p {
    color: #555;
    font-size: 15px;
}
</style>

</body>
</html>
